<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEXTEKO License Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora"></div>
  <div class="aurora a2"></div>
  <div class="aurora a3"></div>

  <div id="view-login" class="view">
    <div class="login-box glass highlight">
      <div class="logo">◈</div>
      <h1>HEXTEKO <span>License</span></h1>
      <p>Admin &amp; Seller Panel</p>
      <input id="in-user" class="inp" placeholder="Username" autocomplete="username">
      <input id="in-pass" class="inp" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn primary" id="btn-login">Đăng nhập</button>
      <div id="login-msg" class="msg"></div>
    </div>
  </div>

  <div id="view-app" class="view hidden">
    <header class="topbar glass">
      <div class="brand">
        <div class="logo">◈</div>
        <div class="brand-txt">
          <h1>HEXTEKO <span>License</span></h1>
          <p id="who"></p>
        </div>
      </div>
      <nav id="nav"></nav>
      <button class="btn ghost" id="btn-logout">Đăng xuất</button>
    </header>
    <main id="main"></main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="panel.js"></script>
</body>
</html>
